<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Update Note</title>
</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'home_create_notes' %}">
            📝 My Notes
        </a>

        <div class="ms-auto">
            <a href="{% url 'home_create_notes' %}" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="{% url 'recycle_bin' %}" class="btn btn-outline-warning me-2">
                Recycle Bin
            </a>

            <a href="{% url 'logout' %}" class="btn btn-danger">
                Logout
            </a>
        </div>

    </div>
</nav>


<!-- Update Card -->

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg border-0">

<div class="card-header bg-primary text-white">

<h3 class="mb-0">
✏️ Update Your Note
</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label fw-bold">

Title

</label>

<input
type="text"
name="title"
class="form-control form-control-lg"
value="{{ note.title }}"
placeholder="Enter Title">

</div>


<div class="mb-4">

<label class="form-label fw-bold">

Description

</label>

<textarea
name="description"
rows="6"
class="form-control"
placeholder="Enter Description">{{ note.description }}</textarea>

</div>


<div class="d-flex justify-content-between">

<a href="{% url 'home_create_notes' %}"
class="btn btn-secondary">

← Back

</a>


<button
type="submit"
class="btn btn-success px-5">

💾 Update Note

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>


</body>
</html>
